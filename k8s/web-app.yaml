apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-web-deployment
  namespace: web-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: static-web
  template:
    metadata:
      labels:
        app: static-web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: static-web-service
  namespace: web-demo
spec:
  type: LoadBalancer
  selector:
    app: static-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
